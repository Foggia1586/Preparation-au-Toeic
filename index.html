<style>
:root{
  --ink:#0b1f3a; --ink2:rgba(11,31,58,.70); --ink3:rgba(11,31,58,.52);
  --acc:#0a7cff; --acc2:#0060d1; --ok:#11884a; --bad:#d23a3f; --warn:#b85f00; --gold:#a87700; --violet:#6a3df0;
  --r-xl:30px; --r-lg:24px; --r-md:18px; --r-sm:13px;
  --shadow:0 14px 44px rgba(12,48,110,.16),0 2px 8px rgba(12,48,110,.08);
  --font:"Futura PT","Futura","Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --title:"Futura PT","Futura","Jost","Century Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#a9c9ec}
body{font:16px/1.55 var(--font);font-weight:400;color:var(--ink);background:transparent;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.sky{position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;z-index:-1;background:url(sky.jpg?v=76c9da225e) center 35%/cover no-repeat,linear-gradient(#2e70c6,#a6cff3)}
@media (max-width:820px){.sky{background-image:url(sky-m.jpg?v=0bdff6586f),linear-gradient(#2e70c6,#a6cff3)}}
.sky::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(255,255,255,.16))}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;isolation:isolate;border-radius:var(--r-lg);
  background:linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,255,255,.38) 55%,rgba(255,255,255,.44));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,255,255,.30),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 10% -12%,rgba(255,255,255,.60),rgba(255,255,255,0) 55%),
             radial-gradient(42% 36% at var(--mx,85%) var(--my,-10%),rgba(255,255,255,.42),rgba(255,255,255,0) 72%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.2px;
  background:linear-gradient(150deg,rgba(255,255,255,.98),rgba(255,255,255,.18) 32%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.75));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.lite{background:rgba(255,255,255,.54);border-radius:var(--r-md);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.55)}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.glass{background:rgba(255,255,255,.86)}}
@media (prefers-reduced-transparency:reduce){.glass{background:rgba(255,255,255,.9)}}

/* ---------- Header / navigation ---------- */
header.top{position:sticky;top:0;z-index:20;max-width:1160px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 8px max(18px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 9px;border-radius:999px;font-size:18px;text-decoration:none;color:var(--ink)}
.brand .logo{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(160deg,#4aa6ff,#0a62d9);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 10px rgba(10,98,217,.35)}
.tabs{display:flex;gap:2px;padding:5px;border-radius:999px;min-width:0}
.sync.off{display:none!important}
header.top{display:grid!important;grid-template-columns:1fr auto 1fr}
header.top>.brand{grid-column:1;justify-self:start}
header.top>.tabs{grid-column:2}
header.top>.row{grid-column:3;justify-self:end}
@media (max-width:1240px) and (min-width:901px){.tabs a{padding:8px 10px;font-size:13.5px;gap:5px}.brand{padding:8px 14px 8px 9px;font-size:17px}.who .nm{display:none}.who{padding:5px}}
@media (max-width:1060px) and (min-width:901px){.tabs a>span:not(.badge){display:none}.tabs a{padding:9px 12px}}
.tabs a{white-space:nowrap;padding:8px 13px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;transition:background .2s}
.tabs a:hover:not(.on){background:rgba(255,255,255,.45)}
.tabs a.on{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.72));box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(255,255,255,.85),0 3px 12px rgba(12,48,110,.16)}
.tabs svg,.tabbar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px;line-height:1}
.sync{font-size:15px;font-weight:600;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);white-space:nowrap}
.tabbar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:30;border-radius:28px;padding:6px;gap:2px;width:min(580px,calc(100% - 18px));justify-content:space-between}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink2);text-decoration:none;padding:7px 2px 5px;border-radius:22px;position:relative}
.tabbar a.on{color:var(--acc2);background:rgba(255,255,255,.78);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(255,255,255,.8)}
.tabbar .badge{position:absolute;top:2px;right:calc(50% - 22px);transform:scale(.85)}
@media (max-width:1100px){.sync{display:none}}
input:focus,select:focus{outline:none;box-shadow:inset 0 1px 3px rgba(12,48,110,.08),0 0 0 2px rgba(10,124,255,.6)}
@media (max-width:620px){.wel .wel-card{padding:28px 16px}.wel .ptiles{gap:12px}.ptiles .ptile{width:calc(50% - 6px)}.wel .wel-title{font-size:30px}.ptiles .av{width:64px!important;height:64px!important;font-size:33px!important}}
@media (max-width:900px){header .tabs{display:none}.tabbar{display:flex}main{padding-bottom:120px!important}.sync{display:none}}

/* ---------- Layout ---------- */
main{max-width:1160px;margin:0 auto;padding:10px max(18px,env(safe-area-inset-right)) 70px max(18px,env(safe-area-inset-left))}
.card{padding:22px}
.hero{padding:24px 26px}
h1,h2,h3{margin:0;color:var(--ink);font-family:var(--title);font-weight:700;font-style:oblique;letter-spacing:.005em}
.brand,.tfont{font-family:var(--title);font-weight:700;font-style:oblique}
h1{font-size:32px;font-weight:700;line-height:1.15}
h2{font-size:21px;font-weight:700}
h3{font-size:16.5px;font-weight:700}
p{margin:.4em 0}
.muted{color:var(--ink2)} .small{font-size:13.5px} .tiny{font-size:12.5px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}}
@media(max-width:620px){.g4,.g3,.g2{grid-template-columns:1fr}.g4.kpi{grid-template-columns:1fr 1fr}.kpi .stat .v{font-size:26px}.kpi .ring-wrap{flex-direction:column;align-items:flex-start;gap:6px}h1{font-size:25px}.card{padding:18px}}
.mt{margin-top:16px}.mt2{margin-top:26px}.mb{margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stat .k{font-size:13px;color:var(--ink2);font-weight:600}
.stat .v{font-family:var(--title);font-size:36px;font-weight:700;letter-spacing:0;line-height:1.1;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(10,124,255,.14);color:var(--acc2)}
.pill.ok{background:rgba(17,136,74,.14);color:var(--ok)}.pill.bad{background:rgba(210,58,63,.13);color:var(--bad)}.pill.warn{background:rgba(184,95,0,.13);color:var(--warn)}.pill.ai{background:rgba(106,61,240,.13);color:var(--violet)}.pill.grey{background:rgba(11,31,58,.08);color:var(--ink2)}
.track{height:8px;background:rgba(11,31,58,.09);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4aa6ff,#0a70e8)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid rgba(11,31,58,.09)}
th{color:var(--ink2);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
a{color:var(--acc2)}
.foot{font-size:12px;color:var(--ink2);margin-top:22px;padding:12px 16px}

/* ---------- Boutons ---------- */
.btn{appearance:none;border:0;font:inherit;font-weight:650;font-size:14.5px;color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.64));
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(255,255,255,.65),0 4px 14px rgba(12,48,110,.12);transition:transform .15s,background .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:linear-gradient(180deg,#fff,rgba(255,255,255,.66))}
.btn:active{transform:scale(.96)}
.btn.primary{color:#fff;background:linear-gradient(180deg,#45a3ff,#0a6ce6);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(0,40,120,.25),0 0 0 1px rgba(0,88,200,.35),0 6px 18px rgba(10,108,230,.35)}
.btn.primary:hover{background:linear-gradient(180deg,#5aaeff,#1676ef)}
.btn.ai{color:#fff;background:linear-gradient(180deg,#9b7bff,#6a3df0);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(40,0,120,.25),0 0 0 1px rgba(90,40,200,.35),0 6px 18px rgba(106,61,240,.32)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip{appearance:none;border:0;font:inherit;font-size:13px;font-weight:650;padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.56);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.chip.on{background:rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(255,255,255,.9),0 2px 8px rgba(12,48,110,.15)}
input,select{font:inherit;padding:9px 12px;border-radius:12px;border:0;background:rgba(255,255,255,.74);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 1px 3px rgba(12,48,110,.08);width:100%}
label.f{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:650}
input[type=range]{padding:0;box-shadow:none;background:transparent}
input[type=checkbox]{width:auto}

/* ---------- Cartes de parties ---------- */
.part{cursor:pointer;transition:transform .18s}
.part:hover{transform:translateY(-3px)}
.part .num{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--acc2)}
.part.off{opacity:.55;cursor:default}
.lvl{border-radius:18px;padding:12px 16px;cursor:pointer;min-width:120px;background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.lvl b{display:block;font-size:20px;font-weight:800}
.lvl.on{background:rgba(255,255,255,.92);box-shadow:inset 0 1px 0 #fff,0 0 0 2px rgba(10,124,255,.55)}

/* ---------- Session ---------- */
.sess-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.6)}
.timer.low{color:var(--bad)}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.dots i{width:10px;height:4px;border-radius:2px;background:rgba(11,31,58,.14)}
.dots i.d{background:var(--acc)}
.dots i.c{background:#7cc1ff}
.sess{display:grid;gap:16px}
.sess.split{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
.sess.split .qcol{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;overscroll-behavior:contain}
@media(max-width:980px){.sess.split{grid-template-columns:1fr}.sess.split .qcol{position:static}}
.photo{border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.75),0 10px 30px rgba(12,48,110,.22);aspect-ratio:3/2;background:#ddd;max-width:640px}
.photo svg{display:block;width:100%;height:100%}
.scene-txt{border-radius:20px;padding:22px;background:rgba(255,255,255,.68);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);font-size:15.5px}
.audio{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:22px;margin-bottom:14px}
.play{width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;flex:none;color:#fff;font-size:18px;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 25%,#7cc1ff,#0a6ce6 70%);box-shadow:inset 0 2px 1px rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,40,120,.35),0 6px 18px rgba(10,108,230,.4),0 0 0 1px rgba(0,88,200,.3)}
.play:disabled{opacity:.4;cursor:not-allowed}
.play:active{transform:scale(.94)}
.wave{display:flex;gap:3px;align-items:center;height:26px;margin-left:auto}
.wave i{width:4px;height:6px;border-radius:2px;background:var(--acc);opacity:.35}
.wave.on i{opacity:1;animation:wv 1s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.12s}.wave.on i:nth-child(3){animation-delay:.24s}.wave.on i:nth-child(4){animation-delay:.36s}.wave.on i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:6px}50%{height:24px}}
@media (prefers-reduced-motion:reduce){.wave.on i{animation:none;height:14px}}
.spk{font-weight:700;color:var(--acc2)}
.q{margin:0 0 20px}
.q .qt{font-weight:650;margin-bottom:8px;white-space:pre-line}
.q .qn{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:7px;background:rgba(11,31,58,.08);font-size:12px;font-weight:800;margin-right:8px;padding:0 6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 14px;margin:7px 0;border-radius:15px;border:0;font:inherit;color:inherit;cursor:pointer;
  background:rgba(255,255,255,.58);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(255,255,255,.7);transition:background .15s,box-shadow .15s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.82)}
.opt .l{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(11,31,58,.14)}
.opt .tx{padding-top:3px}
.opt.sel{background:rgba(10,124,255,.15);box-shadow:inset 0 0 0 2px rgba(10,124,255,.8)}
.opt.sel .l{background:var(--acc);color:#fff;box-shadow:none}
.opt.right{background:rgba(17,136,74,.15);box-shadow:inset 0 0 0 2px rgba(17,136,74,.75)}
.opt.right .l{background:var(--ok);color:#fff;box-shadow:none}
.opt.wrong{background:rgba(210,58,63,.13);box-shadow:inset 0 0 0 2px rgba(210,58,63,.7)}
.opt.wrong .l{background:var(--bad);color:#fff;box-shadow:none}
.opt:disabled{cursor:default}
.letters{display:flex;gap:10px;flex-wrap:wrap}
.letters .opt{width:auto;min-width:64px;justify-content:center;padding:12px 18px}
.exp{margin-top:10px;padding:10px 14px;border-radius:14px;font-size:14px;background:rgba(255,255,255,.74);box-shadow:inset 3px 0 0 var(--acc)}
.exp.bad{box-shadow:inset 3px 0 0 var(--bad)}.exp.good{box-shadow:inset 3px 0 0 var(--ok)}
.doc{background:rgba(255,255,255,.87);border-radius:18px;padding:18px 20px;margin-bottom:14px;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(255,255,255,.9),0 6px 18px rgba(12,48,110,.10);font-size:14.6px;line-height:1.6}
.doc-h{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.doc-b{white-space:pre-wrap}
.doc table{margin:10px 0;background:rgba(255,255,255,.6);border-radius:10px;overflow:hidden}
.blank{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 8px;border-radius:7px;background:rgba(10,124,255,.14);color:var(--acc2);font-weight:800;font-size:12.5px;vertical-align:1px}
.filled{color:var(--ok);font-weight:650;background:rgba(17,136,74,.10);border-radius:6px;padding:0 5px}
.pos{display:inline-block;font-weight:800;color:var(--violet);background:rgba(106,61,240,.12);border-radius:6px;padding:0 5px;font-size:12.5px}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:8px 12px;border-radius:16px;background:rgba(10,124,255,.13)}
.bub.alt{align-self:flex-end;background:rgba(17,136,74,.10)}
.bub .who{font-size:11.5px;font-weight:800;color:var(--ink2)}
.graphic{margin-bottom:14px}
.graphic .cap{font-weight:800;font-size:13px;margin-bottom:6px}
.transcript{font-size:14px;margin-top:6px}
.transcript p{margin:5px 0}
.big{font-family:var(--title);font-size:58px;font-weight:700;letter-spacing:0;line-height:1}
.leitner{display:inline-flex;gap:3px;vertical-align:middle}

<script>
/* ==========================================================
   Part 1 — scènes illustrées (SVG généré), style « photo »
   ========================================================== */
const SCENES = (() => {
  const f = n => +n.toFixed(1);
  const R = (x, y, w, h, fill, rx = 0, ex = '') => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${rx}" fill="${fill}" ${ex}/>`;
  const P = (d, fill, ex = '') => `<path d="${d}" fill="${fill}" ${ex}/>`;
  const Ln = (x1, y1, x2, y2, s, w, ex = '') => `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${s}" stroke-width="${w}" stroke-linecap="round" ${ex}/>`;
  const PL = (pts, s, w, ex = '') => `<polyline points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
  const C = (cx, cy, r, fill, ex = '') => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${r}" fill="${fill}" ${ex}/>`;
  const E = (cx, cy, rx, ry, fill, ex = '') => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${rx}" ry="${ry}" fill="${fill}" ${ex}/>`;
  const G = (t, inner) => `<g transform="${t}">${inner}</g>`;
  function shade(hex, k) { // k<1 darker, k>1 lighter
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const m = v => Math.max(0, Math.min(255, Math.round(k < 1 ? v * k : v + (255 - v) * (k - 1))));
    return '#' + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  }
  let ID = 'x';
  const sh = (cx, cy, rx, ry, o = .22) => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${rx}" ry="${ry}" fill="#000" opacity="${o}" filter="url(#b${ID})"/>`;

  /* ---------- PERSONNAGES ---------- */
  const BASE = { hd: [3, -152], nk: [1, -139], sN: [6, -132], sF: [-6, -133], eN: [9, -108], eF: [-9, -109], hN: [10, -86], hF: [-10, -87], pN: [5, -88], pF: [-4, -88], kN: [6, -46], kF: [-4, -46], fN: [7, 0], fF: [-5, 0] };
  const SIT = { hd: [2, -114], nk: [0, -101], sN: [5, -94], sF: [-6, -95], eN: [8, -72], eF: [-8, -72], hN: [14, -60], hF: [-4, -58], pN: [4, -50], pF: [-4, -51], kN: [32, -52], kF: [27, -52], fN: [33, 0], fF: [27, 0] };
  const POSES = {
    stand: {},
    sit: Object.assign({}, SIT),
    type: Object.assign({}, SIT, { eN: [17, -73], hN: [36, -77], eF: [10, -74], hF: [31, -78] }),
    shake: { eN: [20, -108], hN: [33, -101] },
    pour: { eN: [17, -112], hN: [30, -107], eF: [5, -108], hF: [19, -100] },
    reach: { hd: [4, -153], eN: [13, -158], hN: [18, -184], fN: [9, -3], fF: [-3, -2] },
    point: { eN: [22, -126], hN: [42, -136] },
    climb: { kN: [11, -50], fN: [9, -10], kF: [-3, -44], fF: [-5, 0], eN: [17, -150], hN: [21, -178], eF: [12, -114], hF: [22, -106] },
    push: { hd: [17, -145], nk: [13, -133], sN: [17, -125], sF: [6, -126], eN: [27, -104], hN: [39, -88], eF: [19, -104], hF: [33, -89], pN: [4, -86], pF: [-3, -86], kN: [14, -46], fN: [23, 0], kF: [-8, -45], fF: [-17, 0] },
    water: { eN: [17, -124], hN: [30, -142] },
    phone: { eN: [12, -112], hN: [8, -136] },
    bag: { hN: [12, -84] }
  };
  function person(o) {
    const J = Object.assign({}, BASE, POSES[o.pose || 'stand'], o.j || {});
    const s = o.s || 1, x = o.x, y = o.y, fc = o.f || 1;
    const skin = o.skin || '#e8b896', hair = o.hair || '#2b1d16', top = o.top || '#3f6fb5', bot = o.bot || '#2b3340', shoe = o.shoe || '#1f1f24';
    const sleeve = o.short ? skin : top;
    const pt = k => J[k];
    let g = '';
    // hair behind (long)
    const hd = pt('hd');
    if (o.hs === 'long') g += R(hd[0] - 13, hd[1] - 6, 22, 30, hair, 9);
    // far arm
    g += PL([pt('sF'), pt('eF')], shade(top, .78), 8) + PL([pt('eF'), pt('hF')], shade(sleeve, .8), 7) + C(pt('hF')[0], pt('hF')[1], 4, shade(skin, .85));
    // far leg
    const legC = o.skirt ? shade(o.legs || skin, .85) : shade(bot, .8);
    g += PL([pt('pF'), pt('kF'), pt('fF')], legC, o.skirt ? 8 : 11) + E(pt('fF')[0] + 4, pt('fF')[1] - 3, 8, 3.8, shade(shoe, .9));
    // near leg
    const legN = o.skirt ? (o.legs || skin) : bot;
    g += PL([pt('pN'), pt('kN'), pt('fN')], legN, o.skirt ? 8 : 11) + E(pt('fN')[0] + 4, pt('fN')[1] - 3, 8.5, 4, shoe);
    // skirt
    if (o.skirt) {
      const pn = pt('pN'), pf = pt('pF'), kn = pt('kN'), kf = pt('kF');
      const sitting = Math.abs(kn[1] - pn[1]) < 15;
      if (sitting) g += P(`M${pf[0] - 8},${pf[1] - 8} L${pn[0] + 6},${pn[1] - 8} L${kn[0] + 4},${kn[1] - 6} L${kn[0] + 2},${kn[1] + 6} L${pf[0] - 8},${pf[1] + 6} Z`, o.skirtC || bot, `stroke="${o.skirtC || bot}" stroke-width="4" stroke-linejoin="round"`);
      else g += P(`M${pf[0] - 8},${pf[1] - 8} L${pn[0] + 7},${pn[1] - 8} L${Math.max(kn[0], pn[0]) + 11},${kn[1] - 2} L${Math.min(kf[0], pf[0]) - 11},${kf[1] - 2} Z`, o.skirtC || bot, `stroke="${o.skirtC || bot}" stroke-width="4" stroke-linejoin="round"`);
    }
    // torso
    const sF = pt('sF'), sN = pt('sN'), pN = pt('pN'), pF = pt('pF');

  return{v:1,upd:Math.max(a.upd||0,b.upd||0),list:Object.values(m).sort((x,y)=>(x.t||0)-(y.t||0)),del,last:(a.upd||0)>=(b.upd||0)?a.last:b.last};}
const sameProfiles=(a,b)=>JSON.stringify([a.list,a.del])===JSON.stringify([b.list,b.del]);

  el.textContent={local:'💾',cloud:'☁︎',saving:'⟳',offline:'☁︎',error:'⚠︎'}[st]||'';el.title={local:'Progression enregistrée sur cet appareil',cloud:'Progression synchronisée avec ton compte Claude',saving:'Enregistrement…',offline:'Hors ligne — enregistré sur cet appareil',error:'Synchronisation en pause'}[st]||'';el.setAttribute('aria-label',el.title);}
async function initSync(){

    if(!db||!user){setSync('local');return;}
    const id=await user.id();if(!id){setSync('local');return;}
    SYNC.db=db;SYNC.uid=id;SYNC.pref=db.doc('data/users/'+id+'/profiles');
    const timer=setTimeout(()=>setSync('offline'),10000);
    const [ps,ls]=await Promise.all([SYNC.pref.get(),db.doc('data/users/'+id+'/state').get().catch(()=>null)]);clearTimeout(timer);
    if(ls&&ls.exists){const r=ls.data();if(r&&r.v===2)LEGACY.remote=mergeState(clone(r));}
    const remote=ps.exists?Object.assign(clone(PDEF),clone(ps.data())):clone(PDEF);
    const merged=mergeProfiles(PROF,remote);
    if(!sameProfiles(merged,PROF)){PROF=Object.assign(PROF,merged);try{localStorage.setItem(PKEY,JSON.stringify(PROF));}catch(e){}}

  const ref=SYNC.ref;if(!ref)return;if(SYNC.busy){SYNC.dirty=true;return;}

function qByUid(uid){const k=uid.lastIndexOf(':');const s=SETS[uid.slice(0,k)];const i=+uid.slice(k+1);return s&&s.qs[i]?{set:s,q:s.qs[i],i}:null;}

function secAcc(sec,n=40){const a=S.log.filter(e=>secOf(e[1])===sec).slice(-n);return{acc:a.length?a.filter(e=>e[2]).length/a.length:0,n:a.length};}
function estimate(){const L=secAcc('L'),R=secAcc('R');
  const sL=L.n>=8?clamp(r5(5+490*L.acc),5,495):null,sR=R.n>=8?clamp(r5(5+490*R.acc),5,495):null;
  return{L:sL,R:sR,T:(sL!=null&&sR!=null)?sL+sR:null};}
function partStats(p){const a=S.log.filter(e=>e[1]===p);return{n:a.length,ok:a.filter(e=>e[2]).length};}
function tagStats(){const m={};for(const e of S.log){const t=tagOfLog(e);if(!t)continue;const x=m[t]||(m[t]={n:0,ok:0,p:e[1]});x.n++;if(e[2])x.ok++;}
  return Object.entries(m).map(([t,v])=>({t,...v,acc:v.ok/v.n}));}
function streak(){let d=new Date(),s=0;if(!S.days[dayKey(d)])d.setDate(d.getDate()-1);while(S.days[dayKey(d)]){s++;d.setDate(d.getDate()-1);}return s;}
function daysLeft(){if(!S.goal.date)return null;return Math.ceil((new Date(S.goal.date+'T00:00:00')-startOfDay(Date.now()))/DAY);}
const targetLevel=()=>cefrOf(S.goal.target,'T');
const dueItems=()=>{const now=Date.now();return Object.entries(S.rev).filter(([,r])=>r.d<=now);};

/* =========================================================
   RATTRAPAGE (répétition espacée, 3 boîtes)
   ========================================================= */
// Faux → boîte 0, à revoir tout de suite. Juste → boîte 1 (revoir demain) → boîte 2 (dans 4 jours) → maîtrisée.
function reviewUpdate(uid,part,ok,pick,ai,force){
  const now=Date.now(),r=S.rev[uid];
  if(!ok){
    if(r){r.b=0;r.d=now;r.w=(r.w||0)+1;r.pk=pick;r.last=now;}
    else{S.rev[uid]={p:part,b:0,d:now,w:1,pk:pick,add:now,last:now};if(ai)S.rev[uid].ai=ai;}
    return 'added';
  }
  if(r&&(force||r.d<=now)){r.b++;r.last=now;
    if(r.b>=3){delete S.rev[uid];S.mastered=(S.mastered||0)+1;return 'mastered';}
    r.d=startOfDay(now)+[0,1,4][r.b]*DAY;return 'up';}
  return null;
}
function recordQ(set,q,force){
  const ok=q.pick===q.a,ai=set.ai?{part:set.part,stimulus:set.stimulus||'',q:q.q,c:q.c,a:q.a,e:q.e,t:q.t}:null;
  const entry=[q.uid,set.part,ok?1:0,Date.now(),set.ai?q.t:null,q.pick==null?-1:q.pick,((SES&&SES.mode)||'p')[0]];
  S.log.push(entry);S.days[dayKey()]=(S.days[dayKey()]||0)+1;
  q.rv=reviewUpdate(q.uid,set.part,ok,q.pick,ai,force);
}

const AUD={ctts:null,playing:false,cur:null,lineCb:null,tok:0,el:null,blobs:{},man:{},curId:null};
async function loadAudioMan(){try{const r=await fetch('audio.json',{cache:'no-cache'});if(r.ok)AUD.man=await r.json();}catch(e){}softRender();}
const studioFor=id=>AUD.man[id]||null;
const PACKS={};
function packBlob(f){return PACKS[f]||(PACKS[f]=fetch(f).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.blob();}).catch(e=>{delete PACKS[f];throw e;}));}
async function blobUrl(id){if(AUD.blobs[id])return AUD.blobs[id];const m=studioFor(id);
  if(m.o!=null){const pk=await packBlob(m.f);return AUD.blobs[id]=URL.createObjectURL(pk.slice(m.o,m.o+m.n,'audio/mpeg'));}
  const r=await fetch(m.f);if(!r.ok)throw 0;const b=await r.blob();return AUD.blobs[id]=URL.createObjectURL(b);}
function noteFail(m){if(AUD.failNoted)return;AUD.failNoted=1;toast('Voix studio introuvables : voix de l’appareil utilisée à la place.');}
function prefetch(id){if(studioFor(id)&&!AUD.blobs[id])blobUrl(id).catch(()=>{});}
function engineFor(id){const p=S.prefs.engine,st=!!(id&&studioFor(id));
  if(p==='claude'&&AUD.ctts)return'claude';if(p==='browser'&&BTTS.ok)return'browser';
  return st?'studio':(AUD.ctts?'claude':(BTTS.ok?'browser':'none'));}
function playStudio(id,onLine,rate,start,end){
  stopAudio(true);const tok=AUD.tok,m=studioFor(id);
  const el=AUD.el||(AUD.el=new Audio());AUD.playing=true;AUD.curId=id;
  return new Promise(async res=>{
    let fin=false;const done=v=>{if(fin)return;fin=true;if(AUD.res===done)AUD.res=null;clearInterval(AUD.endT);if(tok===AUD.tok)AUD.playing=false;res(v);};AUD.res=done;
    let url=AUD.blobs[id];if(!url){try{url=await blobUrl(id);}catch(e){url=m.o!=null?null:m.f;}}
    if(tok!==AUD.tok){done(false);return;}
    if(!url){done('nofile');return;}
    if(el.src!==url)el.src=url;
    try{el.preservesPitch=true;el.mozPreservesPitch=true;el.webkitPreservesPitch=true;}catch(e){}
    el.playbackRate=clamp(rate||S.prefs.rate,0.5,1.5);
    let last=-1;
    el.ontimeupdate=()=>{if(tok!==AUD.tok||!m.l)return;const t=el.currentTime;let k=-1;m.l.forEach((x,i)=>{if(t>=x[0]-0.05)k=i;});if(k!==last){last=k;if(onLine&&k>=0)onLine(k);}};
    el.onended=()=>done(true);
    el.onerror=()=>done(false);
    const st=start||0;try{el.currentTime=st;}catch(e){}
    if(el.readyState<1){const fix=()=>{el.removeEventListener('loadedmetadata',fix);if(tok===AUD.tok&&Math.abs(el.currentTime-st)>.3){try{el.currentTime=st;}catch(e){}}};el.addEventListener('loadedmetadata',fix);}
    clearInterval(AUD.endT);
    if(end!=null)AUD.endT=setInterval(()=>{if(tok!==AUD.tok){clearInterval(AUD.endT);return;}if(el.currentTime>=end){try{el.pause();}catch(e){}done(true);}},30);
    let pr;try{pr=el.play();}catch(e){pr=Promise.reject(e);}
    if(pr&&pr.catch)pr.catch(e=>done(e&&e.name==='NotAllowedError'?'blocked':false));
  });
}

const SILENT='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAACAgICA';
function primeAudio(){if(AUD.primed)return;AUD.primed=true;const el=AUD.el||(AUD.el=new Audio());
  try{if(el.src&&!el.paused)return;el.src=SILENT;const p=el.play();if(p&&p.then)p.then(()=>{if(el.src===SILENT)el.pause();}).catch(()=>{AUD.primed=false;});}catch(e){AUD.primed=false;}}

const FEM=/female|samantha|victoria|karen|serena|zira|susan|kate|moira|tessa|aria|jenny|libby|sonia|natasha|clara|michelle|hazel|catherine|linda|ava|allison|fiona|emma|olivia|amy|joanna|salli|kimberly|ivy|nicole/i;

  const f=v.filter(x=>FEM.test(x.name)),m=v.filter(x=>MAL.test(x.name)&&!/female/i.test(x.name));
  if(spk==='W')return f[0]||v[0];if(spk==='W2')return f.find(x=>x.lang!==(f[0]||{}).lang)||f[1]||f[0]||v[0];
  if(spk==='M2')return m.find(x=>x.lang!==(m[0]||{}).lang)||m[1]||m[0]||v[Math.min(1,v.length-1)];

  const pred=part===7&&P7KIND!=='all'?(s=>s.kind===P7KIND):null;
  const sets=pickSets(part,PRACTICE_N[part],pred).map(s=>prep(s));
  if(!sets.length)return toast('Aucune question disponible.');
  openSession({mode:'practice',label:`Entraînement · Part ${part}`,sets});
}
function startReview(all,onlyUid){
  const now=Date.now();let items=Object.entries(S.rev);
  if(onlyUid)items=items.filter(([u])=>u===onlyUid);else if(!all)items=items.filter(([,r])=>r.d<=now);
  items=items.sort((a,b)=>a[1].d-b[1].d).slice(0,24);
  if(!items.length)return toast('Rien à revoir pour le moment 🎉');
  const groups={},ai=[];
  for(const [u,r] of items){if(r.ai){ai.push(aiSet(r.ai,u));continue;}const k=u.lastIndexOf(':');const sid=u.slice(0,k),i=+u.slice(k+1);if(!SETS[sid])continue;(groups[sid]=groups[sid]||[]).push(i);}
  const sets=Object.entries(groups).map(([sid,idx])=>prep(SETS[sid],idx)).concat(ai).sort((a,b)=>a.part-b.part);
  if(!sets.length)return toast('Rien à revoir pour le moment 🎉');
  openSession({mode:'review',label:'Rattrapage',sets,force:!!(all||onlyUid)});
}
function startAI(items,label){const sets=items.map(it=>aiSet(it,'ai-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)));openSession({mode:'ai',label,sets});}
const EXAMS={
 mini:{label:'Mini-test',plan:[[1,3],[2,8],[3,3],[4,3],[5,10],[6,1],[7,2,'single'],[7,1,'double']]},
 full:{label:'Test complet (format officiel)',plan:[[1,6],[2,25],[3,13],[4,10],[5,30],[6,4],[7,10,'single'],[7,2,'double'],[7,3,'triple']]}
};
function startExam(kind){
  if(BANK_STATE!=='ok')return;const E=EXAMS[kind],sets=[];
  for(const [p,n,k] of E.plan)pickSets(p,n,k?(s=>s.kind===k):null).forEach(s=>sets.push(prep(s)));
  const nR=sets.filter(s=>s.part>=5).reduce((a,s)=>a+s.qs.length,0);
  openSession({mode:'exam',kind,label:E.label,sets,rLimit:Math.round(nR*45),rEnd:null});
}
function openSession(o){stopAudio(true);clearInterval(TIMER);SES=Object.assign({i:0,start:Date.now(),finished:false},o);
  if(SES.mode==='exam')TIMER=setInterval(tick,1000);
  if(location.hash!=='#session')location.hash='#session';else render();}
function tick(){if(!SES||SES.mode!=='exam'||SES.finished){clearInterval(TIMER);return;}
  if(!SES.rEnd)return;const left=Math.max(0,Math.round((SES.rEnd-Date.now())/1000));const el=$('#timer');
  if(el){el.textContent='⏱ '+fmtTime(left);el.classList.toggle('low',left<180);}
  if(left<=0){clearInterval(TIMER);finishSession(true);}}
const curSet=()=>SES&&SES.sets[SES.i];
function pick(qi,ci){const s=curSet();if(!s||s.done)return;s.qs[qi].pick=ci;
  const box=document.querySelectorAll('.q')[qi];if(box)box.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===ci));
  const v=$('#validate');if(v)v.disabled=!s.qs.every(q=>q.pick!=null);}
function validate(){const s=curSet();if(!s||s.done||!s.qs.every(q=>q.pick!=null))return;stopAudio(true);s.done=true;
  s.qs.forEach(q=>recordQ(s,q,SES.force));save();
  const wrong=s.qs.filter(q=>q.pick!==q.a).length;if(wrong)toast(wrong>1?`${wrong} questions ajoutées au Rattrapage`:'Question ajoutée au Rattrapage');
  updNav();vSession();}
function nextSet(){stopAudio(true);
  if(SES.mode==='exam'){const s=curSet();if(!s.done){s.done=true;s.qs.forEach(q=>recordQ(s,q));save();}}
  if(SES.i<SES.sets.length-1){SES.i++;vSession();window.scrollTo({top:0,behavior:'smooth'});}else finishSession(false);}
function finishSession(timeout){
  stopAudio(true);clearInterval(TIMER);
  if(SES.mode==='exam')SES.sets.forEach(s=>{if(!s.done){s.done=true;s.qs.forEach(q=>recordQ(s,q));}});
  const all=SES.sets.flatMap(s=>s.qs.map(q=>({q,s})));const ok=all.filter(x=>x.q.pick===x.q.a).length;
  const est=estimate();
  S.sessions.push({t:Date.now(),m:SES.mode,k:SES.kind||null,n:all.length,ok,L:est.L,R:est.R,T:est.T});save();
  SES.finished=true;SES.timeout=!!timeout;render();}
function quitSession(){stopAudio(true);clearInterval(TIMER);SES=null;location.hash='#tableau';}
function canPlay(set){if(engineFor(set.id)==='none'||AUD.playing)return false;if(SES.mode==='exam')return set.played<1;return S.prefs.replay||set.played<1;}
/* Déroulé audio d’une série, comme au vrai test :
   Part 1 « Number 1. Look at the picture marked number 1 in your test book. » · Part 2 « Number 7. »
   Parts 3-4 « Questions one through three refer to the following conversation. » … puis lecture des questions */
const narrOn=()=>S.prefs.annonces!==false;
function setSeq(set){if(!set||set.ai||!studioFor(set.id))return null;const has=id=>!!studioFor(id),out=[];const N=SES?SES.i+1:1;
  if(narrOn()){
    if(set.part===1){if(N<=6)out.push({id:'n-num-'+N},{id:'n-look-'+N});else{if(N<=31)out.push({id:'n-num-'+N});out.push({id:'n-look-0'});}}
    else if(set.part===2){if(N<=31)out.push({id:'n-num-'+N});}
    else if(set.part>=3&&SETS[set.id]&&set.qs.length===SETS[set.id].qs.length)out.push({id:'n-'+set.id+'-i'});}
  out.push({id:set.id,main:true});
  if(narrOn()&&set.part>=3)set.qs.forEach(q=>out.push({id:'n-'+set.id+'-q'+q.num}));
  return out.filter(x=>has(x.id));}
async function playSeqStudio(seq,onLine,onNarr,rate){
  for(let k=0;k<seq.length;k++){const it=seq[k];if(!it.main&&onNarr)onNarr();
    const r=await playStudio(it.id,it.main?onLine:null,rate);if(r!==true)return r;if(k<seq.length-1)AUD.playing=true;}
  return true;}
function playSet(){const set=curSet();if(!set)return;if(AUD.playing){stopAudio();return;}if(!canPlay(set))return;
  set.played++;AUD.cur=set;const lines=audioLines(set),eng=engineFor(set.id);
  const lab=i=>{const el=$('#spk');if(el&&lines[i])el.textContent=(set.part>=3||set.ai)&&set.part!==2&&set.part!==1?'🎙 '+(SPK_LABEL[lines[i][0]]||''):'🎙 '+(set.part===2?(i===0?'Question':'Réponse '+LET[i-1]):'Énoncé '+LET[i]);};
  const narr=()=>{const el=$('#spk');if(el)el.textContent='🎙 Narrateur';};
  const p=eng==='studio'?playSeqStudio(setSeq(set)||[{id:set.id,main:true}],lab,narr).then(r=>{if(r==='nofile'&&BTTS.ok){noteFail();return playLines(lines,lab);}return r;}):playLines(lines,lab);
  updAudio();p.then(r=>{if(r==='blocked'){set.played--;toast('Appuie sur ▶ pour lancer l’audio');}if(AUD.cur===set){AUD.cur=null;}updAudio();});}
function updAudio(){const b=$('#play');const set=curSet();if(!b||!set)return;b.innerHTML=AUD.playing?'■':'▶';b.disabled=!AUD.playing&&!canPlay(set);b.setAttribute('aria-label',AUD.playing?'Arrêter':'Écouter');
  const w=$('#wave');if(w)w.classList.toggle('on',AUD.playing);const st=$('#astat');if(st)st.innerHTML=audioStatus(set);if(!AUD.playing){const sp=$('#spk');if(sp)sp.textContent='';}}
function audioStatus(set){const eng=engineFor(set.id);if(eng==='none')return'Audio indisponible : la transcription est affichée.';

  return canPlay(set)?'Tu peux réécouter.':'Audio déjà diffusé.';}

function vSession(){
  if(!SES){location.hash='#tableau';return;}
  if(SES.finished)return vResult();
  const s=curSet(),P=PARTS[s.part],isL=s.part<=4,exam=SES.mode==='exam',done=s.done;
  if(exam&&!isL&&!SES.rEnd)SES.rEnd=Date.now()+SES.rLimit*1000;
  const hideText=(s.part===1||s.part===2)&&!done&&engineFor(s.id)!=='none';
  let stim='';
  if(isL){
    if(s.part===1)stim+=s.ai?`<div class="scene-txt"><div class="doc-h">Scène (description)</div>${esc(s.stimulus)}</div>`:`<div class="photo" role="img" aria-label="${esc(SCENE_DESC[s.scene]||'Photographie')}">${SCENES.render(s.scene,s.id)}</div>`;
    stim=`<div class="audio glass"><button class="play" id="play" onclick="playSet()" aria-label="Écouter">▶</button><div><b>${s.ai?'Question générée par l’IA':esc(partLabel(s))}</b><div class="small muted" id="astat"></div></div><div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div></div>`+stim;
    if(s.graphic)stim+=`<div class="doc">${tableHTML(s.graphic)}</div>`;
    if(done&&!exam||engineFor(s.id)==='none')stim+=transcriptHTML(s);
  }else if(s.part===6&&!s.ai)stim=passageHTML(s);
  else if(s.part===7&&!s.ai)stim=docsHTML(s);
  else if(s.ai&&s.stimulus&&s.part>=6)stim=`<div class="doc"><div class="doc-h">Document</div><div class="doc-b">${esc(s.stimulus)}</div></div>`;
  const qs=s.qs.map((q,qi)=>{
    let title='';
    if(s.part===1)title=hideText?'Écoute les quatre énoncés et choisis celui qui décrit le mieux la photo.':'Quel énoncé décrit le mieux la photo ?';
    else if(s.part===2)title=hideText?'Écoute la question et les trois réponses, puis choisis la meilleure.':esc(q.q);
    else if(s.part===6&&!s.ai)title=`<span class="qn">Blanc ${q.num}</span>`;
    else title=(s.qs.length>1?`<span class="qn">${q.num}</span>`:'')+esc(q.q);
    const opts=q.c.map((c,ci)=>{let cl='opt';if(done&&!exam){if(ci===q.a)cl+=' right';else if(ci===q.pick)cl+=' wrong';}else if(q.pick===ci)cl+=' sel';
      return`<button class="${cl}" ${done?'disabled':''} onclick="pick(${qi},${ci})"><span class="l">${LET[ci]}</span>${hideText?'':`<span class="tx">${esc(c)}</span>`}</button>`;}).join('');
    let fb='';
    if(done&&!exam){const ok=q.pick===q.a;
      fb=`<div class="exp ${ok?'good':'bad'}"><b>${ok?'✓ Bonne réponse.':'✗ Réponse : '+LET[q.a]+'.'}</b> ${esc(q.e)}
       ${!ok?`<div class="row mt" style="margin-top:8px">${q.rv==='added'?'<span class="pill">↻ Ajoutée au Rattrapage</span>':''}${aiOn()?`<button class="btn ai sm" onclick="aiExplain('${q.uid}',${q.pick})">✨ Explique-moi</button><button class="btn sm" onclick="aiTwin('${q.uid}')">✨ Question jumelle</button>`:''}</div>`:(q.rv==='mastered'?'<div class="mt"><span class="pill ok">★ Question maîtrisée — retirée du Rattrapage</span></div>':q.rv==='up'?'<div class="mt"><span class="pill ok">↑ Progrès enregistré dans le Rattrapage</span></div>':'')}</div>`;}
    return`<div class="q"><div class="qt">${title}</div><div class="${hideText?'letters':''}">${opts}</div>${fb}</div>`;}).join('');

    done?`<button class="btn primary" onclick="nextSet()">${SES.i<SES.sets.length-1?'Suivant →':'Voir le bilan'}</button>`:`<button class="btn primary" id="validate" ${all?'':'disabled'} onclick="validate()">Valider</button>`;

function vResult(){
  const all=SES.sets.flatMap(s=>s.qs.map(q=>({q,s}))),ok=all.filter(x=>x.q.pick===x.q.a).length,exam=SES.mode==='exam';
  const sec=k=>{const a=all.filter(x=>secOf(x.s.part)===k);return{n:a.length,ok:a.filter(x=>x.q.pick===x.q.a).length};};
  const L=sec('L'),R=sec('R');const scl=x=>x.n?clamp(r5(5+490*x.ok/x.n),5,495):null;
  const sL=scl(L),sR=scl(R),e=estimate();
  const by={};all.forEach(({q,s})=>{const b=by[s.part]||(by[s.part]={n:0,ok:0});b.n++;if(q.pick===q.a)b.ok++;});
  const wrong=all.filter(x=>x.q.pick!==x.q.a);

    :`<div class="card glass"><div class="small muted">Score estimé (tendance)</div><div class="big">${e.T??'—'}</div><div class="small muted">${e.T!=null?`L ${e.L} · R ${e.R} · niveau ${cefrOf(e.T,'T')}`:'Réponds à 8 questions par section pour l’activer'}</div></div>`;
  app.innerHTML=`<div class="hero glass"><h1>Bilan — ${esc(SES.label)}</h1>${SES.timeout?'<p class="pill warn mt">⏱ Temps écoulé : les questions sans réponse comptent comme fausses.</p>':''}</div>
  <div class="grid g3 mt"><div class="card glass"><div class="small muted">Bonnes réponses</div><div class="big">${ok}<span class="muted" style="font-size:24px">/${all.length}</span></div><div class="small muted">${pct(all.length?ok/all.length:0)}</div></div>${head}
   <div class="card glass"><div class="small muted">Rattrapage</div><div class="big" style="color:var(--violet)">${wrong.length}</div><div class="small muted">question${wrong.length>1?'s':''} ajoutée${wrong.length>1?'s':''} à revoir</div></div></div>
  <div class="card glass mt"><h2>Par partie</h2><table class="mt ptable">${Object.entries(by).map(([p,v])=>`<tr><td>Part ${p} · ${PARTS[p].name}</td><td style="width:42%"><div class="track"><i style="width:${v.ok/v.n*100}%"></i></div></td><td>${v.ok}/${v.n}</td></tr>`).join('')}</table></div>
  ${wrong.length?`<div class="card glass mt"><div class="spread"><h2>Correction des erreurs</h2>${Object.keys(S.rev).length?`<button class="btn primary sm" onclick="startReview(false)">Réviser le Rattrapage</button>`:''}</div>
   ${wrong.slice(0,60).map(({q,s})=>`<div class="rv"><span class="pill grey">P${s.part}</span><div><div class="tiny muted">${esc(q.t)}</div><div class="snip">${esc(q.q||(s.part===1?SCENE_DESC[s.scene]||'Photo':''))}</div>
     <div class="small">Ta réponse : <b style="color:var(--bad)">${q.pick!=null?LET[q.pick]+' — '+esc(q.c[q.pick]):'—'}</b> · Bonne réponse : <b style="color:var(--ok)">${LET[q.a]} — ${esc(q.c[q.a])}</b></div><div class="tiny muted" style="margin-top:4px">${esc(q.e)}</div></div>
     <div class="row">${aiOn()?`<button class="btn ai sm" onclick="aiExplain('${q.uid}',${q.pick})">✨ Explique-moi</button>`:''}</div></div>`).join('')}</div>`:''}
  <div class="row mt"><a class="btn primary" href="#tableau" onclick="SES=null">Tableau de bord</a><a class="btn" href="#rattrapage" onclick="SES=null">Voir le Rattrapage</a><a class="btn" href="#entrainement" onclick="SES=null">Continuer l’entraînement</a></div>`;
}

function chart(){const pts=S.sessions.filter(s=>s.T!=null).slice(-20);
  if(pts.length<2)return'<div class="empty small">La courbe apparaîtra après deux sessions couvrant Listening et Reading.</div>';

   <line x1="${P}" x2="${W-12}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="#a87700" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W-14}" y="${y(tgt)-7}" text-anchor="end" font-size="11" fill="#a87700" font-weight="700">Objectif ${tgt}</text>

    DS.plays++;playStudio(it.id,null,rate,start).then(r=>{if(r==='blocked')toast('Appuie sur ▶ pour lancer l’audio');

const KPRED={contraction:w=>/'/.test(w)&&w!=="o'clock",nombre:w=>w in NUMW||w in TENS||w==='hundred'||w==='thousand'||w in ORDW||/^\d/.test(w),

function dictSrc(did,errs){const d=DICT.find(x=>x.id===did);
  if(d)return{text:d.text,aud:{id:d.id,segs:[{l:'Écouter',a:0,b:null,tx:[['W',d.text]]}],def:0}};
  const e=errs.find(x=>x.s);if(!e)return null;const au=e.au;

  const idx=[...new Set(errs.filter(e=>e.i>=0&&e.i<raw.length).map(e=>e.i))].slice(0,5).sort((a,b)=>a-b);if(!idx.length)return null;
  const k=modeOf(errs.map(e=>e.k)),di=DICT.findIndex(x=>x.id===did);
  return clozeCard({title:'Dictée à trous ciblée',key:'cz:'+did+':'+idx.join('.'),did,dtext:src.text,au:src.au,src:`Les mots que tu avais ratés${di>=0?' · Dictée '+(di+1):''}`,aud:src.aud,raw,blanks:idx,
    e:DTIPS[k]?`<b>${esc(DTIPS[k].l)}</b> — ${esc(DTIPS[k].t)}`:''});}
function clozeForKind(kind,used){const pred=KPRED[kind]||KPRED.autre,lv=S.dlvl||1,rs=rcSeen(),cand=[];
  for(const d of DICT){if(Math.abs(d.lvl-lv)>1)continue;const key='dk:'+d.id+':'+kind;if(used.has(key))continue;const raw=dTokens(d.text).raw,pos=[];
    raw.forEach((w,i)=>{const c=coreW(w);if(c&&pred(c))pos.push(i);});if(pos.length<2)continue;
    cand.push({d,raw,pos,key,sc:((S.dict[d.id]||{}).ok?2:0)+(rs[key]?1.5:0)+(S.derr.some(x=>x.d===d.id)?1:0)+Math.random()*.6});}
  if(!cand.length)return null;cand.sort((a,b)=>a.sc-b.sc);const x=cand[0],lab=(DTIPS[kind]||DTIPS.autre).l;
  return clozeCard({title:'Dictée à trous · '+lab,key:x.key,did:x.d.id,dtext:x.d.text,src:`Même difficulté que tes fautes : ${esc(lab.toLowerCase())}`,
    aud:{id:x.d.id,segs:[{l:'Écouter',a:0,b:null,tx:[['W',x.d.text]]}],def:0},raw:x.raw,blanks:spread(x.pos,kind==='petit mot'?4:3),
    e:`<b>${esc(lab)}</b> — ${esc((DTIPS[kind]||DTIPS.autre).t)}`});}
function cardSegDict(m){const set=m.set,q=m.q,p=set.part,lines=audioLines(set),L=(studioFor(set.id)||{}).l||[];let li,sg;
  if(p===2){li=0;sg={t:lines[0][1],a:L[0]?L[0][0]:null,b:L[0]?L[0][1]:null,k:0};}
  else if(p>=3){const loc=locate(set,q,m.i);if(!loc)return null;li=loc.li;sg=loc;}else return null;
  const nw=sg.t.split(/\s+/).length;if(nw<4||nw>28||/\d/.test(sg.t))return null;
  const a=sg.a!=null?Math.max(0,sg.a-.1):null,b=sg.b!=null?sg.b+.2:null,did=`seg:${set.id}:${li}:${sg.k||0}`;
  return{k:'dict',kind:'segdict',title:'Transcris l’extrait',key:'sg:'+did.slice(4),tag:secOf(p)+'|'+q.t,did,text:sg.t,au:[set.id,a,b],
    src:`Extrait d’une question ratée · Part ${p} · ${esc(q.t)}`,aud:{id:set.id,segs:[{l:'Extrait',a,b,tx:[[lines[li][0],sg.t]]}],def:0},
    intro:'Écoute et écris exactement ce que tu entends. Vise 100 % : la ponctuation et les majuscules ne comptent pas.',e:''};}
function recapDictee(){const A=coachAnalyse(),used=new Set(),cz=[],kd=[],sg=[];
  const byItem=new Map();for(let i=S.derr.length-1;i>=0;i--){const d=S.derr[i];if(d.k==='trop'||d.i==null||d.i<0)continue;if(!byItem.has(d.d))byItem.set(d.d,[]);byItem.get(d.d).push(d);}

  app.innerHTML=`<div class="hero glass"><h1>Récap terminé 🎉</h1><p class="muted">${RC.ok} réussite${RC.ok>1?'s':''} sur ${RC.n} exercice${RC.n>1?'s':''}. Le coach tient compte de ces résultats pour tes prochains récaps.</p>
   ${Object.keys(by).length?`<table class="mt ptable">${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="width:40%"><div class="track"><i style="width:${v.n?v.ok/v.n*100:0}%"></i></div></td><td class="small muted">${v.ok} / ${v.n}</td></tr>`).join('')}</table>`:''}
   <div class="row mt"><button class="btn primary" onclick="startRecap('${RC.type}')">Nouvelle série</button>${['audio','texte','dictee'].filter(t=>t!==RC.type).map(t=>`<button class="btn" onclick="startRecap('${t}')">${RCLAB[t]}</button>`).join('')}<button class="btn" onclick="rcQuit()">Retour au Rattrapage</button></div></div>`;}
function rcKeyGlobal(e){const c=rcCur();if(!c)return false;const k=e.key.toLowerCase(),idx='abcd'.indexOf(k)>=0?'abcd'.indexOf(k):'1234'.indexOf(k);
  if(c.k==='mcq'&&!c.done&&idx>=0&&idx<c.opts.length){rcPick(idx);return true;}
  if(e.key==='Enter'){if(c.done||(c.k==='dict'&&c.tries))rcNext();else rcCheck();return true;}
  if(e.key===' '&&c.aud){rcPlay();return true;}return false;}

/* ---------- carte « IA Coach » (page Rattrapage) ---------- */
function coachCard(){const A=coachAnalyse(),has=A.nErr+A.nD>0;
  const head=`<div class="spread"><h2>🧠 IA Coach</h2><span class="pill">Sur l’appareil · hors ligne</span></div>`;
  if(!has)return`<div class="card glass mt coach">${head}<p class="small muted mt">Le coach étudie tes erreurs (entraînement en écoute et en lecture, rattrapage, examens blancs, dictées) et te prépare des exercices récapitulatifs. Fais une première série : il se met au travail dès ta première erreur.</p></div>`;
  const T=[['audio','🎧','Récap audio','Réécoute ciblée du passage clé, sons proches, pièges.',A.srcAudio,'erreur'+(A.srcAudio>1?'s':'')+' d’écoute'],
    ['texte','📖','Récap texte','Trouve l’erreur, même règle dans une phrase nouvelle.',A.srcTexte,'erreur'+(A.srcTexte>1?'s':'')+' de lecture'],
    ['dictee','✍︎','Récap dictée','Dictées à trous sur tes fautes, extraits à transcrire.',A.srcDict,'source'+(A.srcDict>1?'s':'')+' d’erreurs']];
  return`<div class="card glass mt coach">${head}
   <p class="small muted" style="margin:6px 0 4px">Analyse de ${A.nErr} erreur${A.nErr>1?'s':''} en questions${A.nD?` et de ${A.nD} faute${A.nD>1?'s':''} dans ${A.nDi} dictée${A.nDi>1?'s':''}`:''}.${A.prios.length?' Tes priorités :':''}</p>
   ${A.prios.length?`<div class="prios">${A.prios.map((p,i)=>`<div class="prio"><span class="pn">${i+1}</span><div style="min-width:0"><b>${esc(p.label)}</b> <span class="tiny muted">· ${esc(p.stat)}</span><div class="small">${esc(p.tip)}</div></div></div>`).join('')}</div>`:''}
   <div class="grid g3 mt">${T.map(([k,ic,t,d,n,u])=>`<div class="lite rtile"><div class="row" style="gap:8px"><span class="ic">${ic}</span><b>${t}</b></div><div class="small muted">${d}</div><div class="tiny muted">${n?`D’après ${n} ${u}`:'Pas encore de données'}</div><button class="btn ${n?'primary':''} sm" ${n?'':'disabled'} onclick="startRecap('${k}')">Lancer</button></div>`).join('')}</div></div>`;}
function coachTodo(){const A=coachAnalyse();if(!A.prios.length)return null;const lastRc=Math.max(0,...Object.values(S.rcLast||{}));
  const fresh=S.log.filter(e=>!e[2]&&e[3]>lastRc&&e[6]!=='c').length+new Set(S.derr.filter(d=>d.t>lastRc&&!d.rc).map(d=>d.d)).size;if(fresh<3)return null;
  const p0=A.prios[0];return{ic:'🧠',t:'Récap de tes erreurs',d:`IA Coach · ${fresh} nouvelle${fresh>1?'s':''} erreur${fresh>1?'s':''} · priorité : ${esc(p0.label)}`,b:'Lancer',a:`startRecap('${p0.act}')`};}

/* =========================================================
   ROUTAGE
   ========================================================= */
let CUR='';
function updNav(){const h=CUR;$('#tabs').innerHTML=navHTML(false);$('#tabbar').innerHTML=navHTML(true);
  const w=$('#who'),p=curProfile();if(w)w.innerHTML=p?`${avatarHTML(p,30)}<span class="nm">${esc(p.name)}</span>`:'';
  document.querySelectorAll('#tabs a,#tabbar a').forEach(a=>a.classList.toggle('on',a.dataset.k===h||(h==='session'&&a.dataset.k==='entrainement')||(h==='recap'&&a.dataset.k==='rattrapage')||(h==='referentiel'&&a.dataset.k==='objectifs')));}
function render(){
  let h=(location.hash||'#accueil').slice(1);if(h==='session'&&!SES)h='tableau';if(h==='recap'&&!RC)h='rattrapage';
  if(!PID||!curProfile()){if(PID&&!curProfile()){PID=null;S=clone(DEFAULT);}h='accueil';if(location.hash!=='#accueil')history.replaceState(null,'','#accueil');}
  const changed=h!==CUR;CUR=h;document.body.classList.toggle('welcome',h==='accueil');updNav();
  ({accueil:vWelcome,tableau:vDash,entrainement:vPractice,dictee:vDictee,rattrapage:vReview,examen:vExam,objectifs:vGoals,referentiel:vRef,session:vSession,recap:vRecap}[h]||vDash)();
  if(changed)window.scrollTo(0,0);
}
function softRender(force){if(CUR==='accueil'&&WEL.mode==='create'){updNav();return;}if(CUR==='recap'&&RC){updNav();return;}if(CUR==='session'&&!force){updNav();updAudio();return;}if(CUR==='session'&&SES&&!SES.finished){updNav();return;}render();}
window.addEventListener('hashchange',()=>{if(location.hash!=='#session'&&location.hash!=='#recap')stopAudio(true);if(location.hash!=='#recap'&&RC&&RC.over)RC=null;if(location.hash!=='#dictee'&&DS&&!DS.over){}render();});
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('.glass');if(!el)return;const r=el.getBoundingClientRect();
  el.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');el.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');},{passive:true});
document.addEventListener('keydown',e=>{
  const tg=e.target&&e.target.closest?e.target:document.body;
  if(tg.closest('input,select,textarea'))return;
  if((e.key==='Enter'||e.key===' ')&&tg.closest('button,a,[role=button]'))return;
  if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return;}
  if(CUR==='accueil'&&e.key==='Enter'&&WEL.mode!=='create'&&PROF.last&&!$('#modal').innerHTML){selectProfile(PROF.last);e.preventDefault();return;}
  if(CUR==='recap'&&RC&&!$('#modal').innerHTML){if(rcKeyGlobal(e))e.preventDefault();return;}
  if(CUR!=='session'||!SES||SES.finished||$('#modal').innerHTML)return;const s=curSet();if(!s)return;
  const k=e.key.toLowerCase(),idx='abcd'.indexOf(k)>=0?'abcd'.indexOf(k):'1234'.indexOf(k);
  if(idx>=0&&!s.done){const qi=s.qs.findIndex(q=>q.pick==null);const t=qi<0?s.qs.length-1:qi;if(idx<s.qs[t].c.length){pick(t,idx);}e.preventDefault();}
  else if(e.key==='Enter'){const v=$('#validate');if(v&&!v.disabled)validate();else if(s.done||SES.mode==='exam')nextSet();e.preventDefault();}
  else if(e.key===' '&&s.part<=4){playSet();e.preventDefault();}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('[role=button]')){e.target.click();}});
/* ---------- Version installable (GitHub Pages) : mode hors connexion + mises à jour ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  const SWC=navigator.serviceWorker;let hadCtl=!!SWC.controller,reloading=false,waiting=null;
  SWC.addEventListener('message',e=>{const d=e.data||{};
    if(d.type==='progress'){OFF.done=d.done;OFF.total=d.total;if(OFF.state!=='error'||d.done>=d.total)OFF.state=d.done>=d.total?'ready':'loading';offUpd();
      if(d.done>=d.total&&d.fresh&&!OFF.toasted){OFF.toasted=1;toast('Application prête hors connexion ✓');}}
    else if(d.type==='ready'){OFF.state='ready';offUpd();}
    else if(d.type==='error'){OFF.state='error';OFF.bad=d.bad||[];offUpd();}});
  window.offRetry=()=>{OFF.state='loading';OFF.done=0;offUpd();SWC.ready.then(r=>{if(r.active)r.active.postMessage({type:'status'});});};
  try{SWC.startMessages();}catch(e){}
  SWC.addEventListener('controllerchange',()=>{if(!hadCtl){hadCtl=true;return;}if(reloading)return;reloading=true;location.reload();});
  const showUpd=w=>{waiting=w;const el=document.getElementById('upd');if(el)el.classList.add('on');};
  window.applyUpdate=force=>{const busy=(SES&&!SES.finished)||(DS&&!DS.over)||(RC&&!RC.over);
    if(busy&&!force){modal(`<h2>Mettre à jour maintenant ?</h2><p class="small muted mt">La série en cours sera interrompue. Tes réponses déjà validées sont enregistrées.</p><div class="row mt"><button class="btn" onclick="closeModal()">Plus tard</button><button class="btn primary" onclick="closeModal();applyUpdate(true)">Mettre à jour</button></div>`);return;}
    const el=document.getElementById('upd');if(el)el.classList.remove('on');if(waiting)waiting.postMessage({type:'skip'});};
  window.checkUpdate=async()=>{try{const reg=await SWC.getRegistration();if(!reg)return toast('Vérification impossible pour le moment.');
    await reg.update();if(reg.waiting&&SWC.controller){showUpd(reg.waiting);return toast('Nouvelle version prête : touche « Mettre à jour ».');}
    if(reg.installing)return toast('Nouvelle version en cours de téléchargement…');toast('Tu as déjà la dernière version ✓');}
    catch(e){toast('Vérification impossible : es-tu connecté à internet ?');}};
  window.addEventListener('load',()=>{
    SWC.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      if(reg.waiting&&SWC.controller)showUpd(reg.waiting);
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&SWC.controller)showUpd(nw);});});
      SWC.ready.then(r=>{if(r.active)r.active.postMessage({type:'status'});});
      setInterval(()=>reg.update().catch(()=>{}),3*3600*1000);
    }).catch(()=>{});
  });
}

try{history.replaceState(null,'','#accueil');}catch(e){}
WEL.mode=PROF.list.length?'pick':'create';if(!PROF.list.length)openCreate();
setSync('local');render();loadBank();loadAudioMan();initSync();initTTS();initAI();
</script>
